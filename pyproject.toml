[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-blueprint-invoice-ap-intelligence"
version = "0.1.0"
description = "Trida AI Blueprint — Invoice & Accounts-Payable Document Intelligence Agent, built on NVIDIA NIM (reference prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
# Direct dependencies are pinned EXACTLY (==). Loose >= ranges made pip's
# resolver backtrack for minutes on Python 3.10 (see constraints.txt header).
# The full transitive set is frozen in constraints.txt; install with:
#   pip install -e ".[dev]" -c constraints.txt
dependencies = [
    "langgraph==0.6.11",
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    # Transitive via langchain-core -> langsmith (websockets>=15.0, unbounded).
    # websockets 17.x requires Python >=3.11. 16.0 supports Python 3.10.
    "websockets==16.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
llm = ["openai==3.27.0", "anthropic==1.13.0"]
# Production state: PostgreSQL (records store, LangGraph checkpointer,
# pgvector policy embeddings). Required whenever DATABASE_URL is set.
postgres = ["psycopg[binary]==3.3.6"]
# Document blobs in S3-compatible object storage (AWS S3 / MinIO).
s3 = ["boto3==1.43.111"]

[project.scripts]
ap-agent = "ap_agent.cli:main"
ap-agent-demo = "ap_agent.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ap_agent = ["data/*.json", "static/*.html", "static/brand/*.png", "static/brand/*.svg", "static/brand/*.ico", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
